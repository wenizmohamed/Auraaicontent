# Added 2026-04-26 — broaden gzip_types beyond the default text/html, and
# reuse the existing global "gzip on" setting.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    application/wasm;
