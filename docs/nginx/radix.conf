# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name srv1494206.hstgr.cloud 187.77.158.177;
    return 301 https://srv1494206.hstgr.cloud$request_uri;
}

# Main site
server {
    listen 443 ssl;
    server_name srv1494206.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/srv1494206.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1494206.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — once a browser visits the FQDN over HTTPS, it remembers to never
    # use plain HTTP for this host again. Prevents "not secure" warnings from
    # users who type the host without a protocol prefix.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API proxy to Fastify backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }
    # /v2/* — external Bearer-key API surface (port from AURA-Manus pattern)
    location /v2/ {
        proxy_pass http://127.0.0.1:8080/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }


    # Socket.IO (agent + bo namespaces) — needs WebSocket upgrade or
    # EIO polling falls back + Weni's console floods with failures.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # Static uploads
    location /uploads/ {
        alias /opt/radix-v2/server/uploads/;
        expires 7d;
    }

    # Frontend SPA
    root /opt/radix-v2/frontend/dist;
    index index.html;

    # Hashed assets must be real files — return 404 (not SPA fallback) when missing.
    # Stops stale bundles from silently returning index.html when the deploy hash changes.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # RADIX-SEC-HEADERS-INJECTED
    }

    # index.html must NEVER be cached — browsers must revalidate every visit
    # so freshly deployed bundles (with new asset hashes) are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires off;
        try_files $uri $uri/ /index.html;
    }
}

