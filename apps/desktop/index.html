<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURAAI — AI Content Planner</title>
    <link rel="icon" href="/radix-logo.jpg" />
    <script>
      // Self-heal: unregister any stale service worker from a prior PWA build,
      // clear its caches, then reload ONCE. The current build registers no SW.
      // Order matters: the one-shot sessionStorage flag is set only AFTER
      // cleanup succeeds (a failed attempt simply retries next load), and every
      // cache delete is awaited before the reload so nothing is orphaned. Fully
      // try/caught so a rejection can never reach window.onunhandledrejection
      // (which would overwrite the radix_last_crash diagnostic slot). nginx's
      // 410 + Clear-Site-Data kill-switch on /sw.js stays the authoritative
      // layer — this only helps clients that receive a fresh index.html while
      // still carrying an old registration.
      (async function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          if (sessionStorage.getItem('__radix_sw_cleared')) return;
          var rs = await navigator.serviceWorker.getRegistrations();
          if (!rs || !rs.length) return;
          await Promise.all(rs.map(function (r) { return r.unregister(); }));
          if (window.caches && caches.keys) {
            var ks = await caches.keys();
            await Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }
          sessionStorage.setItem('__radix_sw_cleared', '1');
          location.reload();
        } catch (e) { /* retry on next load; never surface */ }
      })();
    </script>
    <script>
      // Pre-React lang/dir sync (A11Y WCAG 3.1.1). Runs before main.tsx so
      // first paint already reflects the user's chosen locale instead of
      // briefly flashing English LTR for Arabic users.
      try {
        var l = localStorage.getItem('radix.locale');
        if (l === 'ar' || l === 'en') {
          document.documentElement.lang = l;
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        }
      } catch (e) {}
      // Pre-React theme sync — eliminates the dark/light flash by setting
      // the right class on <html> BEFORE the React app mounts. Mirrors the
      // resolution logic in lib/theme-context.tsx (must stay in sync).
      try {
        var t = localStorage.getItem('radix_theme') || 'auto';
        var resolved = t;
        if (t === 'auto') {
          if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            if (mq.media !== 'not all') resolved = mq.matches ? 'dark' : 'light';
            else { var h = new Date().getHours(); resolved = (h >= 6 && h < 18) ? 'light' : 'dark'; }
          } else resolved = 'dark';
        }
        var root = document.documentElement;
        if (resolved === 'dark')   root.classList.add('dark');
        if (resolved === 'light')  root.classList.add('light');
        if (resolved === 'studio') root.classList.add('theme-studio');
        root.dataset.themeMode = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
