name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, million-dollar-hardening]

jobs:
  static:
    runs-on: ubuntu-latest
    # Job-level env so the Chromatic step can gate on the secret being set.
    # GitHub Actions disallows referencing `secrets.*` directly in `if:` —
    # the standard workaround is to project the secret into env first.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Server typecheck
        run: cd server && npm run typecheck

      - name: Server lint (route boundary)
        # Blocking as of 2026-04-27 sweep: no-explicit-any across routes is now zero.
        run: cd server && npm run lint

      - name: Server npm audit (production, high+)
        run: cd server && npm audit --production --audit-level=high
        continue-on-error: true

      - name: Frontend deps
        run: cd apps/desktop && npm ci

      - name: Frontend typecheck
        run: cd apps/desktop && npm run typecheck

      - name: Frontend a11y lint (jsx-a11y + raw-color guard)
        # Errors fail the build; warnings are budgeted with a ratchet target.
        #
        # Current count (2026-04-30): 1232 warnings total
        #   - ~133 pre-existing jsx-a11y on legacy click handlers / unlabeled
        #     inputs / videos without captions
        #   - ~1099 no-restricted-syntax on raw color literals in src/pages/
        #     (598 text-zinc-*, 332 border-white/x, 104 raw bg-zinc-*, 65 hex bg)
        #
        # Ratchet plan: -200 per sprint as legacy pages migrate off raw colors.
        # When the no-restricted-syntax count hits 0, flip the rule from `warn`
        # to `error` in apps/desktop/eslint.config.js and drop this budget back
        # to ~200 (covering only the legitimate jsx-a11y residue).
        run: cd apps/desktop && npm run lint:a11y -- --max-warnings 1300

      - name: Frontend npm audit
        run: cd apps/desktop && npm audit --production --audit-level=high
        continue-on-error: true

      - name: Frontend bundle build
        run: cd apps/desktop && npx vite build

      - name: Frontend bundle-size budget (initial JS ≤ 250KB gzipped)
        run: |
          cd apps/desktop
          INDEX_JS=$(ls dist/assets/index-*.js | head -1)
          if [ -z "$INDEX_JS" ]; then
            echo "::error::No index-*.js found in dist/assets — build broken"
            exit 1
          fi
          GZ_BYTES=$(gzip -c "$INDEX_JS" | wc -c)
          GZ_KB=$((GZ_BYTES / 1024))
          BUDGET_KB=250
          echo "Initial JS: ${GZ_KB} KB gzipped (budget: ${BUDGET_KB} KB)"
          if [ "$GZ_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Initial JS bundle ${GZ_KB}KB exceeds ${BUDGET_KB}KB budget"
            exit 1
          fi

      # Chromatic visual-regression baseline.
      # Requires CHROMATIC_PROJECT_TOKEN repo secret. To set it:
      #   1. Sign in at https://www.chromatic.com/ with the repo's GitHub account
      #   2. Create a project, copy the project token
      #   3. GitHub → repo → Settings → Secrets and variables → Actions → New
      #      repository secret → Name: CHROMATIC_PROJECT_TOKEN, Value: <token>
      # When the secret is missing, this step is skipped (no-op) so the build
      # stays green for forks and contributors who don't have the token.
      - name: Chromatic visual snapshots
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: |
          cd apps/desktop
          npx chromatic --exit-zero-on-changes --build-script-name=storybook:build

  smoke:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Spin up ephemeral stack (postgres + redis + radix-api)
        run: docker compose -f docker-compose.ci.yml up --build -d

      - name: Wait for radix-api to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/health; then
              echo " radix-api ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "radix-api never became healthy"
          docker compose -f docker-compose.ci.yml logs --tail=200
          exit 1

      - name: Install + run smoke
        run: |
          cd server && npm ci
          SMOKE_BASE_URL=http://localhost:8080 npx vitest run

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
