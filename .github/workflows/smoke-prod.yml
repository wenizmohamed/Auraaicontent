name: Smoke (prod)
# Verifies the live VPS is responding. Runs every 4h + on-demand.
#
# Scope: HTTP-level smoke only — does the API answer, does nginx serve
# the SPA shell. No DB, no auth, no business-logic assertions.
#
# The cross-tenant integration suite (server/test/tenancy.spec.ts) is an
# in-process Fastify test that needs DATABASE_URL + a real Postgres. It
# was previously invoked here and broke smoke for everyone — run it
# locally with a scratch DB instead:
#   cd server && DATABASE_URL=postgres://… npm test -- tenancy.spec.ts
# When we want it in CI, give it its own job with a postgres service
# container; do not bolt it onto smoke-prod.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: API health check
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL --max-time 10 https://srv1494206.hstgr.cloud/api/health)
          echo "$BODY"
          STATUS=$(echo "$BODY" | python3 -c 'import json,sys;print(json.load(sys.stdin)["status"])')
          test "$STATUS" = "ok"

      - name: Frontend SPA shell reachable
        run: |
          set -euo pipefail
          HTML=$(curl -fsSL --max-time 10 https://srv1494206.hstgr.cloud/)
          echo "$HTML" | grep -q '<div id="root">'
          echo "$HTML" | grep -q 'RADIX'
